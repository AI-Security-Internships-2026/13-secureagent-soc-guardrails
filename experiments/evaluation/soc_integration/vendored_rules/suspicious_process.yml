id: PROC-ENC-PS-001
name: Encoded PowerShell command
severity: critical
mitre: [T1059.001, T1027]
description: >
  PowerShell launched with an encoded command — the single most common
  malware delivery technique observed in SME compromises.
match:
  all:
    - field: category
      equals: process
    - field: process
      icontains: powershell
    - field: command_line
      regex: "(?i)-e(nc(odedcommand)?)?\\s+[A-Za-z0-9+/=]{20,}"
entity: host
---
id: PROC-LOLBIN-001
name: Living-off-the-land binary abuse
severity: high
mitre: [T1218]
description: >
  certutil/mshta/regsvr32/rundll32 invoked with URL or decode arguments —
  legitimate Windows binaries commonly abused to download or run payloads.
match:
  all:
    - field: category
      equals: process
  any:
    - field: command_line
      regex: "(?i)certutil.*(-urlcache|-decode)"
    - field: command_line
      regex: "(?i)mshta.*(http|javascript)"
    - field: command_line
      regex: "(?i)regsvr32.*(/i:|http)"
    - field: command_line
      regex: "(?i)rundll32.*(http|javascript)"
entity: host
